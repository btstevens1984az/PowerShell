name: DriftGuard CI

on:
  push:
    branches: [main, master]
    paths:
      - "DriftGuard/**"
      - ".github/workflows/driftguard.yml"
  pull_request:
    paths:
      - "DriftGuard/**"
      - ".github/workflows/driftguard.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DriftGuard/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        run: |
          export DATABASE_URL=sqlite:///./test_driftguard.db
          export SEED_DEMO_DATA=false
          export SECRET_KEY=ci-secret
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DriftGuard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & build
        run: |
          npm install
          npm run build
